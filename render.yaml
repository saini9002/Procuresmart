# Render.com free-tier deployment.
# 1. Push aerchain_mvp/ to a Git repo.
# 2. On render.com: New → Blueprint → point at this repo.
# 3. Set the GEMINI_API_KEY environment variable in the Render dashboard (never commit it).
services:
  - type: web
    name: kill-the-quote
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: FX_USD_INR
        value: "95"
